name: Build & Publish Docker Images

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  # Ricostruzione mensile dell'ultima release: le immagini partono da node:24-alpine
  # e nginx:alpine senza versione, quindi invecchiano finché non si rifà la build
  # (v0.1.30 è nata così: la 0.1.29 aveva nginx 1.31.4 con sei CVE aperte).
  # Ripubblica gli stessi tag semver, perché la produzione è fissata su IMAGE_TAG.
  schedule:
    - cron: '0 4 1 * *'
  workflow_dispatch:

env:
  REBUILD: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
  REGISTRY: docker.io
  BACKEND_IMAGE: manzolo/software-checker-backend
  FRONTEND_IMAGE: manzolo/software-checker-frontend

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          fetch-depth: ${{ env.REBUILD == 'true' && '0' || '1' }}

      - name: Check out latest release (rebuild)
        id: release
        if: env.REBUILD == 'true'
        run: |
          tag=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)
          test -n "$tag"
          git checkout --quiet "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Rebuilding $tag on fresh base images" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata for backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ env.REBUILD != 'true' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Extract metadata for frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: |
            type=ref,event=branch,enable=${{ env.REBUILD != 'true' }}
            type=semver,pattern={{version}},value=${{ steps.release.outputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.release.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
